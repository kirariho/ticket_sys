spring:
  application:
    name: tapp

  server:
    port: 8085

  jpa:
    ddl-auto: validate

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:/db.changelog-master.yaml


